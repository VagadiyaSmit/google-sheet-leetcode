name: Update Google Sheet

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run automation
        env:
          SHEET_WEBHOOK: ${{ secrets.SHEET_WEBHOOK }}
        run: python scripts/update_sheet.py
